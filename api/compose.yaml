name: epr-backend-development

services:
  proxy:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    ports:
      - "${EPR_PROXY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/epr-local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --header='Host: epr.test' http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    build:
      context: ./docker/postgresql
    image: epr-postgresql:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EPR_DB_NAME:-epr}
      POSTGRES_USER: ${EPR_DB_OWNER_USERNAME:-epr_owner}
      POSTGRES_PASSWORD: ${EPR_DB_OWNER_PASSWORD:-epr-owner-local-only}
      EPR_DB_MIGRATION_USERNAME: ${EPR_DB_MIGRATION_USERNAME:-epr_migrator}
      EPR_DB_MIGRATION_PASSWORD: ${EPR_DB_MIGRATION_PASSWORD:-epr-migrator-local-only}
      EPR_DB_USERNAME: ${EPR_DB_USERNAME:-epr_app}
      EPR_DB_PASSWORD: ${EPR_DB_PASSWORD:-epr-app-local-only}
    ports:
      - "127.0.0.1:${EPR_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=\"$${POSTGRES_USER}\" --dbname=\"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
